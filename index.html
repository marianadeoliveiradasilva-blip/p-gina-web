<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    
    <!-- Importando fontes fofas do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* 1) Fundo de bolinhas acompanhando a tela toda */
            background-image: url('fundo.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            /* 4) Fundo branco com leve transparência (0.85) e bordas arredondadas */
            background-color: rgba(255, 255, 255, 0.85);
            color: #7B0A26; /* Cor vinho/bordô combinando com o tema */
            text-align: center;
            max-width: 800px;
            margin: 0 auto 40px auto;
            padding: 30px;
            border-radius: 40px; 
        }

        header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 70px;
            margin: 0;
        }

        header p {
            font-family: 'Dancing Script', cursive;
            font-size: 35px;
            margin: 0;
        }

        main {
            /* Fundo transparente para mostrar as bolinhas do body */
            background-color: transparent;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        article {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .figurinha {
            width: 150px;
            height: auto;
        }

        /* Classe para ajustar o tamanho da imagem dos filmes */
        .filmes {
            width: 100%;
            height: auto;
            border-radius: 15px; /* Deixa as pontinhas da imagem levemente redondas */
        }

        .conteudo-post {
            color: #7B0A26;
            font-weight: bold;
            text-align: center;
            font-size: 20px;
        }

        .artigo-autor {
            font-size: 16px;
            opacity: 0.8;
            font-style: italic;
        }

        button {
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px 10px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>

<body>
    <header>
        <!-- 3) Textos do cabeçalho modificados -->
        <h1>Blog</h1>
        <p>Para meninas que amam romance</p>
    </header>
    <main>
        
        <!-- Primeiro Post: Figurinha e Texto de Boas-vindas -->
        <article>
            <!-- 2) Imagem da figurinha atualizada -->
            <img class="figurinha" src="figurinha.png"
                alt="Desenho de um cachorrinho fofo com óculos">

            <div class="conteudo-post">
                <!-- 5) Autora e texto substituídos -->
                <p class="artigo-autor">Por: Marina de Oliveira da Silva</p>
                <p>Olá meninas, sejam bem vindas!<br>
                criei esse blog, para todas vocês apoixanadas por romances. Aqui irei indicar alguns de meus romances favoritos, espero que vocês gostem!!!</p>

                <!-- 6) Botões mantidos -->
                <button> 👍<span>0</span></button>
                <button> 👎<span>0</span></button>
            </div>
        </article>
        
        <!-- Segundo Post: Imagem dos filmes -->
        <article>
            <!-- 7) Segundo parágrafo substituído pela imagem filmes.png -->
            <img class="filmes" src="filmes.png"
                alt="Colagem com vários pôsteres de filmes de romance">
        </article>
        
    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {
            let curtiu = false;
            
            botao.addEventListener("click", function () {
                let texto = botao.querySelector("span");
                
                if (curtiu === false) {
                    texto.textContent++;
                    curtiu = true;
                } else {
                    texto.textContent--;
                    curtiu = false;
                }
            });
        });
    </script>
</body>

</html>
